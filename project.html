<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Configuración Mora Machina</title>
  <link rel="stylesheet" href="project.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>Mora Machina</h1>
      <p class="subtitle">Configuración</p>
    </header>

    <main>
      <section class="settings">
        <h2>Ajustes</h2>
        <p>Configurá cada cuánto Mora Machina te interrumpe para invitarte a la pausa.</p>
        <form id="settings-form">
          <label for="interval-input">Intervenir cada (minutos)</label>
          <input type="number" id="interval-input" min="0.1" step="0.1" required>
          <button type="submit" id="save-btn">Guardar</button>
        </form>
        <p id="settings-status" class="status"></p>
      </section>

      <section class="messages">
        <h2>Mensajes</h2>
        <p>Todas las frases que Mora Machina puede decir. Editá, borrá o agregá y guardá.</p>
        <ul id="messages-list"></ul>
        <div class="actions">
          <button type="button" id="add-message-btn">+ Añadir mensaje</button>
          <button type="button" id="save-messages-btn" class="primary">Guardar cambios</button>
        </div>
        <p id="messages-status" class="status"></p>
      </section>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="project.js"></script>
</body>

</html>
